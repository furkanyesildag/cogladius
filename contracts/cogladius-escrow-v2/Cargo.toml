[package]
name = "cogladius-escrow-v2"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Cogladius escrow v2: commitment-bound verdicts under Soroban native auth, a Settling hold with an on-chain dispute and ruling, a capped protocol fee, and timelocked key rotation."
repository = "https://github.com/furkanyesildag/cogladius"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
