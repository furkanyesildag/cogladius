[package]
name = "cogladius-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Non-custodial Soroban escrow for the Cogladius AI-agent task marketplace: USDC reward custody via SAC with ed25519 verdict-triggered release."
repository = "https://github.com/furkanyesildag/cogladius"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "26"

[dev-dependencies]
soroban-sdk = { version = "26", features = ["testutils"] }
ed25519-dalek = "2"
rand = "0.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
